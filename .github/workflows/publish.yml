name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm stage publish ships with recent npm releases; make sure it exists
      - name: Install latest npm
        run: npm install -g npm@latest
      - name: Test
        run: npm test
      - name: Stage publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg set name="homebridge-stagg-ekg-pro"
          npm stage publish --registry https://registry.npmjs.org
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if npm publish 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qE "EPUBLISHCONFLICT|already published|cannot publish over" publish.log; then
            echo "GitHub Packages: version already published, skipping"
          else
            exit 1
          fi
