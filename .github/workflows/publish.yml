name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm stage publish ships with recent npm releases; make sure it exists
      - name: Install latest npm
        run: npm install -g npm@latest
      - name: Test
        run: npm test
      - name: Stage publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg set name="homebridge-stagg-ekg-pro"
          # npm does not read NODE_AUTH_TOKEN itself; write the token for
          # the target registry into .npmrc (setup-node only does this when
          # registry-url is set).
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          set -o pipefail
          if npm stage publish --registry https://registry.npmjs.org 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qE "EPUBLISHCONFLICT|already published|cannot publish over" publish.log; then
            echo "npmjs: version already published, skipping"
          else
            cat publish.log
            exit 1
          fi
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          set -o pipefail
          if npm publish 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qE "EPUBLISHCONFLICT|already published|cannot publish over" publish.log; then
            echo "GitHub Packages: version already published, skipping"
          else
            exit 1
          fi
