name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write # OIDC: npm trusted publishing for the npmjs stage

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm stage publish ships with recent npm releases; make sure it exists
      - name: Install latest npm
        run: npm install -g npm@latest
      - name: Test
        run: npm test
      - name: Stage publish to npmjs
        id: npmjs
        run: |
          npm pkg set name="homebridge-stagg-ekg-pro"
          # Trusted publishing (OIDC): npm detects the GitHub Actions OIDC
          # environment (id-token: write) and authenticates with the
          # short-lived JWT allowed by the package's trusted publisher
          # config, so no npm token is stored in the repo.
          set -o pipefail
          if npm stage publish --registry https://registry.npmjs.org 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qiE "EPUBLISHCONFLICT|E409|already published|previously published|already staged" publish.log; then
            echo "npmjs: version already published, skipping"
          else
            cat publish.log
            exit 1
          fi
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # setup-node (registry-url) redirects the user config file via
          # NPM_CONFIG_USERCONFIG; append to that file, or to ~/.npmrc when
          # it is unset.
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          # The npmjs step renames the package to its unscoped name; GitHub
          # Packages requires the account-scoped name, so restore it.
          # GITHUB_REPOSITORY is owner/repo; only the repo name goes in the
          # unscoped part (a full owner/repo would create a double slash).
          npm pkg set name="@$GITHUB_REPOSITORY_OWNER/${GITHUB_REPOSITORY##*/}"
          set -o pipefail
          if npm publish 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qiE "EPUBLISHCONFLICT|E409|already published|previously published" publish.log; then
            echo "GitHub Packages: version already published, skipping"
          else
            cat publish.log
            exit 1
          fi
      # Homebridge UI shows the GitHub Release notes for a version; create
      # the release from the tag's commit message (skip if it already exists).
      - name: Create GitHub release
        if: steps.npmjs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          notes_file=$(mktemp)
          git log -1 --format=%B "$GITHUB_REF_NAME" > "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --title "v${GITHUB_REF_NAME#v}" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA" \
            --latest
