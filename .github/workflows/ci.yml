name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # LTS versions Homebridge 2.x runs on; keep in sync with engines.node in
        # package.json — the --engine-strict install below fails the job if the
        # matrix and the declared range drift apart.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --engine-strict
      - name: Test
        run: npm test
